name: Publier Le Multivers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le JavaScript
        run: node --check app.js
      - name: Vérifier l’API et les interactions Discord
        run: node --test tests/api.test.cjs tests/interactions.test.cjs
      - name: Préparer le site
        run: |
          mkdir _site
          cp index.html gestion.html style.css app.js config.js _site/
          cp -r assets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
